name: Build iOS (Manual, Unsigned IPA)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  build-ios:
    name: Build iOS App (unsigned IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build iOS (بدون امضا)
        run: flutter build ios --release --no-codesign

      - name: Package as unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r ../../ios-unsigned.ipa Payload/
          ls -lh ../../ios-unsigned.ipa

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios-unsigned.ipa
          retention-days: 30